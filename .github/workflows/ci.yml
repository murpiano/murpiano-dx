name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check shell syntax
        run: |
          for f in murpiano-dx install.sh sync.sh \
                   skills/repo-release/release.sh \
                   skills/repo-cleanup/scan-traces.sh \
                   skills/repo-cleanup/pre-commit-hook.sh \
                   skills/repo-cleanup/commit-msg-hook.sh \
                   skills/repo-cleanup/patterns.sh; do
            bash -n "$f"
          done
      - name: Integration tests
        run: python3 -B -m unittest discover -s tests -v
      - name: Check npm package contents
        run: npm pack --dry-run
