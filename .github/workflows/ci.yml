name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check shell syntax
        run: bash -n install.sh && bash -n sync.sh && bash -n skills/repo-release/release.sh
      - name: Integration tests
        run: python3 -B -m unittest discover -s tests -v
