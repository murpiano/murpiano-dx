# Checks commit messages of every push and the title, description and
# commits of every pull request with kysaro's default preset.
# Kysaro is installed as a project dev dependency and uses the committed settings.
name: kysaro

on:
  push:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  kysaro:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci
      - name: Check messages
        run: npx --no-install kysaro ci
