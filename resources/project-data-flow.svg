<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="470" viewBox="0 0 1400 470" role="img" aria-labelledby="title desc">
  <title id="title">Two independent projects use one local murpiano-dx</title>
  <desc id="desc">murpiano-dx is in the center. An optional GitHub backup is above it. Project A is on the left and project B on the right. Identical arrows send shared rules and templates to each coding agent and store each project's instructions, notes, decisions, and setup state in murpiano-dx. Source code stays in the project.</desc>
  <defs>
    <marker id="rules" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2463a6"/></marker>
    <marker id="notes" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#527164"/></marker>
    <marker id="backup" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#66778a"/></marker>
  </defs>
  <rect width="1400" height="470" rx="20" fill="#f8fafc"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#15283f">
    <rect x="490" y="20" width="420" height="88" rx="14" fill="#fff" stroke="#b7c6d6" stroke-width="2"/>
    <text x="700" y="56" font-size="22" font-weight="700">Optional GitHub backup</text>
    <text x="700" y="84" font-size="18">Your choice: private or public</text>

    <path d="M700 230 V119" fill="none" stroke="#66778a" stroke-width="2" stroke-dasharray="6 5" marker-start="url(#backup)" marker-end="url(#backup)"/>
    <rect x="578" y="135" width="244" height="48" rx="6" fill="#f8fafc"/>
    <text x="700" y="153" font-size="16" fill="#526379">Automatic two-way sync</text>
    <text x="700" y="175" font-size="16" fill="#526379">on session start and end</text>

    <rect x="20" y="230" width="265" height="170" rx="16" fill="#fff" stroke="#b7c6d6" stroke-width="2"/>
    <text x="152" y="272" font-size="26" font-weight="700">Project A</text>
    <text x="152" y="316" font-size="20">Coding agent</text>
    <text x="152" y="361" font-size="18">Code + Git history stay here</text>

    <rect x="500" y="230" width="400" height="170" rx="16" fill="#eaf3fe" stroke="#2463a6" stroke-width="3"/>
    <text x="700" y="272" font-size="30" font-weight="700">murpiano-dx</text>
    <text x="700" y="316" font-size="21">Your shared rules and templates</text>
    <text x="700" y="361" font-size="20">Separate agent data for each project</text>

    <rect x="1115" y="230" width="265" height="170" rx="16" fill="#fff" stroke="#b7c6d6" stroke-width="2"/>
    <text x="1247" y="272" font-size="26" font-weight="700">Project B</text>
    <text x="1247" y="316" font-size="20">Coding agent</text>
    <text x="1247" y="361" font-size="18">Code + Git history stay here</text>

    <path d="M500 275 H297" fill="none" stroke="#2463a6" stroke-width="2.5" marker-end="url(#rules)"/>
    <path d="M900 275 H1103" fill="none" stroke="#2463a6" stroke-width="2.5" marker-end="url(#rules)"/>
    <text x="392" y="251" font-size="18" fill="#2463a6">Rules and templates</text>
    <text x="1007" y="251" font-size="18" fill="#2463a6">Rules and templates</text>

    <path d="M285 350 H488" fill="none" stroke="#527164" stroke-width="2.5" marker-end="url(#notes)"/>
    <path d="M1115 350 H912" fill="none" stroke="#527164" stroke-width="2.5" marker-end="url(#notes)"/>
    <text x="392" y="380" font-size="17" fill="#426452">Instructions · Notes</text>
    <text x="392" y="404" font-size="17" fill="#426452">Decisions · Setup state</text>
    <text x="1007" y="380" font-size="17" fill="#426452">Instructions · Notes</text>
    <text x="1007" y="404" font-size="17" fill="#426452">Decisions · Setup state</text>
    <text x="700" y="445" font-size="17" fill="#526379">Same workflow. Separate projects. One place for shared rules and saved agent data.</text>
  </g>
</svg>
