<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>murpiano Developer Experience framework preview</title>
<style>
  @font-face {
    font-family: "Roboto Local";
    src: url("./Roboto-wdth-wght.ttf") format("truetype");
    font-style: normal;
    font-weight: 100 900;
    font-stretch: 75% 100%;
    font-display: swap;
  }
  :root {
    color-scheme: light;
    --motion-float: 6s;
    --ease-float: cubic-bezier(.42, 0, .58, 1);
  }
  * { box-sizing: border-box; }
  html, body { width: 100%; min-width: 320px; min-height: 100%; margin: 0; background: #fff; }
  body { display: grid; place-items: start center; font-family: Arial, Helvetica, sans-serif; }
  .diagram {
    position: relative;
    width: min(100vw, 1724px);
    aspect-ratio: 1724 / 912;
    overflow: hidden;
    background: #fff url("./logo-background.png") center / 100% 100% no-repeat;
    isolation: isolate;
  }
  .core-breathe {
    position: absolute;
    z-index: 2;
    inset: 0;
  }
  .core-glow {
    position: absolute;
    left: 35%;
    top: 21.8%;
    width: 30%;
    aspect-ratio: 1;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(73, 204, 255, .5) 42%, rgba(73, 204, 255, .32) 59%, rgba(73, 204, 255, 0) 78%);
    opacity: .95;
    filter: blur(13px);
    transform: scale(.86);
    animation: glow-breathe var(--motion-float) var(--ease-float) infinite;
    will-change: transform, opacity, filter;
  }
  .core-art {
    position: absolute;
    left: 33.76%;
    top: 19.74%;
    width: 32.48%;
    height: auto;
    transform-origin: center;
    will-change: transform;
  }
  .core-inner {
    animation: core-lead var(--motion-float) var(--ease-float) infinite;
  }
  .core-ring {
    animation: core-follow var(--motion-float) var(--ease-float) infinite;
  }
  .label {
    position: absolute;
    z-index: 4;
    top: calc(var(--y) * 100%);
    display: flex;
    align-items: center;
    height: calc(118 / 912 * 100%);
    padding: 0 clamp(5px, .65vw, 11px);
    padding-right: clamp(8px, 1.35vw, 23px);
    overflow: hidden;
    border-radius: 0 clamp(5px, 1.4vw, 24px) clamp(5px, 1.4vw, 24px) 0;
    background: #fff;
    color: #101820;
    font-size: clamp(6px, 1.85vw, 32px);
    font-family: "Roboto Local", "Arial Narrow", Arial, Helvetica, sans-serif;
    font-stretch: 75%;
    font-weight: 400;
    font-variation-settings: "wdth" 75, "wght" 400;
    letter-spacing: -.01em;
    line-height: 1.12;
  }
  .label.left { left: 10.15%; width: 18.45%; }
  .label.right { left: 77.75%; width: 18.2%; }
  @keyframes core-lead {
    0%, 100% { transform: scale(1); }
    45% { transform: scale(1.12); }
  }
  @keyframes core-follow {
    0%, 8%, 100% { transform: scale(1); }
    55% { transform: scale(1.16); }
  }
  @keyframes glow-breathe {
    0%, 8%, 100% { transform: scale(.86); }
    55% { transform: scale(1.32); }
  }
  @media (prefers-reduced-motion: reduce) {
    .core-glow, .core-inner, .core-ring { animation: none; }
  }
</style>
</head>
<body>
<main class="diagram" aria-label="murpiano Developer Experience framework capability map">
  <div class="core-breathe" aria-hidden="true">
    <div class="core-glow"></div>
    <img class="core-art core-inner" src="./logo-core.png" alt="">
    <img class="core-art core-ring" src="./logo-ring.png" alt="">
  </div>
  <div class="label left" style="--y:.052632">Context, Memory<br>&amp; Sync</div>
  <div class="label left" style="--y:.208333">Rules &amp; Agent<br>Setup</div>
  <div class="label left" style="--y:.364035">Project Data<br>&amp; Migration</div>
  <div class="label left" style="--y:.519737">Project &amp;<br>Stack Setup</div>
  <div class="label left" style="--y:.675439">Backend<br>&amp; Data</div>
  <div class="label left" style="--y:.831140">Frontend<br>&amp; UX</div>
  <div class="label right" style="--y:.052632">Architecture<br>Guidance</div>
  <div class="label right" style="--y:.208333">Git &amp;<br>Collaboration</div>
  <div class="label right" style="--y:.364035">Quality &amp;<br>Security</div>
  <div class="label right" style="--y:.519737">Docs &amp;<br>Metadata</div>
  <div class="label right" style="--y:.675439">CI &amp;<br>Testing</div>
  <div class="label right" style="--y:.831140">Releases &amp;<br>Operations</div>
</main>
</body>
</html>
