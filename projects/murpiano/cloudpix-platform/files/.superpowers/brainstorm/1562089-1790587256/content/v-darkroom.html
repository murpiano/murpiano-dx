<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CloudPix — B · Darkroom</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --room: #0e0605;
    --safe: #d42b1c;
    --safe-dim: #7a1a12;
    --paper: #efe6da;
    --text: #d8b9a8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--room); color: var(--text);
    font-family: 'DM Mono', monospace; font-size: 12px; letter-spacing: .04em;
    user-select: none; cursor: crosshair;
  }
  /* safelight glow from the ceiling */
  .glow {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(ellipse 60% 45% at 50% -8%, rgba(212, 43, 28, .55), transparent 70%),
      radial-gradient(ellipse 90% 70% at 50% 110%, rgba(40, 8, 6, .9), transparent 70%);
    animation: hum 5s ease-in-out infinite;
  }
  @keyframes hum { 50% { opacity: .86; } }
  .lamp { position: fixed; top: 0; left: 50%; width: 90px; height: 14px; margin-left: -45px; background: var(--safe); border-radius: 0 0 10px 10px; box-shadow: 0 0 60px 20px rgba(212, 43, 28, .55); z-index: 3; }

  /* ---------- chrome ---------- */
  .top { position: fixed; inset: 0 0 auto 0; padding: 26px 34px; display: flex; justify-content: space-between; align-items: flex-start; z-index: 20; }
  .mark { font-family: 'Syne'; font-weight: 800; font-size: 26px; letter-spacing: -.02em; color: var(--paper); display: flex; align-items: center; gap: 10px; }
  .mark i { width: 10px; height: 10px; border-radius: 50%; background: var(--safe); box-shadow: 0 0 12px var(--safe); }
  nav { display: flex; gap: 26px; text-transform: lowercase; }
  nav a { color: var(--text); text-decoration: none; opacity: .75; }
  nav a:hover { opacity: 1; color: var(--safe); }

  .timer { position: fixed; top: 72px; right: 34px; z-index: 20; text-align: right; }
  .timer .clock { font-family: 'DM Mono'; font-size: 40px; font-weight: 500; color: var(--safe); text-shadow: 0 0 18px rgba(212, 43, 28, .6); letter-spacing: .04em; line-height: 1; }
  .timer small { display: block; margin-top: 6px; text-transform: uppercase; letter-spacing: .14em; font-size: 10px; opacity: .7; }

  .hero { position: fixed; left: 34px; bottom: 90px; z-index: 20; pointer-events: none; font-family: 'Syne'; font-weight: 700; color: var(--paper); font-size: clamp(38px, 6.2vw, 104px); line-height: .92; letter-spacing: -.035em; mix-blend-mode: screen; }
  .hero em { font-style: normal; color: var(--safe); }
  .foot { position: fixed; left: 34px; right: 34px; bottom: 26px; z-index: 20; display: flex; justify-content: space-between; text-transform: uppercase; letter-spacing: .14em; font-size: 10px; opacity: .7; }
  .meter { position: fixed; left: 34px; top: 50%; z-index: 20; transform: translateY(-50%); display: grid; gap: 5px; }
  .meter i { width: 18px; height: 3px; background: var(--safe-dim); transition: background .6s, width .6s; }
  .meter i.on { background: var(--paper); width: 28px; }

  /* ---------- room ---------- */
  .stage { position: fixed; inset: 0; perspective: 900px; perspective-origin: 50% 2%; z-index: 5; }
  .world { position: absolute; left: 50%; top: 30%; transform-style: preserve-3d; }
  .line { position: absolute; left: -1600px; width: 3200px; height: 1.5px; top: 0; background: linear-gradient(90deg, transparent, #b98f7a 12%, #b98f7a 88%, transparent); opacity: .55; transform-style: preserve-3d; }
  .print {
    position: absolute; top: 0; transform-origin: 50% -6px; transform-style: preserve-3d;
    padding: 10px 10px 26px; background: var(--paper); cursor: pointer;
    box-shadow: 0 30px 50px rgba(0, 0, 0, .6);
    animation: sway var(--sw, 6s) ease-in-out var(--dl, 0s) infinite alternate;
  }
  @keyframes sway { from { rotate: var(--r1, -2deg); } to { rotate: var(--r2, 2deg); } }
  .print img { display: block; width: var(--w, 240px); aspect-ratio: 4 / 3; object-fit: cover; pointer-events: none;
    filter: grayscale(1) sepia(1) hue-rotate(-38deg) saturate(4) brightness(.42) contrast(1.35);
    transition: filter 3.2s cubic-bezier(.4, 0, .2, 1); }
  .print.dev img { filter: none; }
  .print .cap { position: absolute; left: 10px; right: 10px; bottom: 7px; display: flex; justify-content: space-between; font-size: 9px; color: #6b5448; letter-spacing: .1em; text-transform: uppercase; }
  /* safelight tint on the paper border until developed */
  .print::after { content: ''; position: absolute; inset: 0; background: rgba(212, 43, 28, .38); mix-blend-mode: multiply; transition: opacity 3.2s; pointer-events: none; }
  .print.dev::after { opacity: 0; }
  .pin { position: absolute; top: -12px; width: 9px; height: 26px; background: linear-gradient(90deg, #6e4a33, #a57b58 45%, #6e4a33); border-radius: 2px; }
  .pin.l { left: 22px; } .pin.r { right: 22px; }

  /* ---------- lightbox ---------- */
  .box { position: fixed; inset: 0; z-index: 40; background: rgba(8, 3, 2, .94); display: grid; place-items: center; opacity: 0; pointer-events: none; transition: opacity .4s; cursor: default; }
  .box.open { opacity: 1; pointer-events: auto; }
  .box figure { background: var(--paper); padding: 16px 16px 46px; position: relative; transform: translateY(30px) rotate(-1.5deg); transition: transform .6s cubic-bezier(.2,.8,.2,1); }
  .box.open figure { transform: rotate(-.6deg); }
  .box img { display: block; max-width: min(74vw, 1000px); max-height: 70vh; }
  .box figcaption { position: absolute; left: 16px; right: 16px; bottom: 16px; display: flex; justify-content: space-between; font-size: 11px; color: #5b463b; text-transform: uppercase; letter-spacing: .12em; }
  .box .x { position: fixed; top: 26px; right: 34px; background: none; border: 0; color: var(--text); font: inherit; text-transform: lowercase; cursor: pointer; }

  @media (max-width: 760px) {
    .hero { bottom: 70px; font-size: 11vw; }
    .timer { top: 64px; } .timer .clock { font-size: 28px; }
    nav a:not(:last-child) { display: none; }
    .meter { display: none; }
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="lamp"></div>

  <header class="top">
    <div class="mark"><i></i>cloudpix</div>
    <nav><a href="#">archive</a><a href="#">upload</a><a href="#">about</a></nav>
  </header>

  <div class="timer"><div class="clock" id="clock">00:00</div><small id="devCount">0 / 19 developed</small></div>
  <div class="meter" id="meter"></div>

  <div class="stage" id="stage"><div class="world" id="world"></div></div>

  <h1 class="hero">Every frame<br />comes out of<br /><em>the dark.</em></h1>
  <footer class="foot"><span>scroll — walk the lines · drag — look around · hover — develop</span><span>open archive · 2026</span></footer>

  <div class="box" id="box">
    <button class="x" id="close">close ✕</button>
    <figure><img id="boxImg" alt="" /><figcaption><span id="capL"></span><span id="capR"></span></figcaption></figure>
  </div>

<script>
  const PHOTOS = 19;
  const LINES = 5, GAP = 520;            // lines one behind another
  const world = document.getElementById('world');
  const meter = document.getElementById('meter');
  const prints = [];
  const rnd = (seed) => { const x = Math.sin(seed * 999) * 10000; return x - Math.floor(x); };

  let p = 0;
  for (let l = 0; l < LINES; l++) {
    const z = -l * GAP;
    const y = -40 + (l % 2) * 26;
    const line = document.createElement('div');
    line.className = 'line';
    line.style.transform = `translate3d(0, ${y}px, ${z}px)`;
    world.appendChild(line);
    const count = l === LINES - 1 ? 3 : 4;
    for (let k = 0; k < count; k++, p++) {
      const idx = p;
      const el = document.createElement('div');
      el.className = 'print';
      const w = 220 + rnd(p + 1) * 70;
      const x = (k - (count - 1) / 2) * 340 + (l % 2 ? 170 : 0) + (rnd(p + 7) - .5) * 60 - w / 2;
      el.style.setProperty('--w', w + 'px');
      el.style.setProperty('--sw', (5 + rnd(p + 3) * 4).toFixed(2) + 's');
      el.style.setProperty('--dl', (-rnd(p + 5) * 6).toFixed(2) + 's');
      const a = (rnd(p + 9) - .5) * 5;
      el.style.setProperty('--r1', (a - 1.6).toFixed(2) + 'deg');
      el.style.setProperty('--r2', (a + 1.6).toFixed(2) + 'deg');
      el.style.translate = `${x}px ${y + 6}px ${z}px`;
      el.innerHTML = `<span class="pin l"></span><span class="pin r"></span><img src="/files/p${idx + 1}.jpg" alt="" draggable="false" /><div class="cap"><span>No. ${String(idx + 1).padStart(2, '0')}</span><span>${['f/2.8','f/4','f/5.6','f/8'][idx % 4]} · ${(idx * 7) % 50 + 10}s</span></div>`;
      el.addEventListener('pointerenter', () => develop(idx));
      el.addEventListener('click', () => { if (!moved) open(idx); });
      world.appendChild(el);
      prints.push({ el, z, dev: false });
      const bar = document.createElement('i'); meter.appendChild(bar);
    }
  }

  const bars = meter.children;
  function develop(i) {
    const pr = prints[i];
    if (pr.dev) return;
    pr.dev = true; pr.el.classList.add('dev'); bars[i].classList.add('on');
    const n = prints.filter((q) => q.dev).length;
    document.getElementById('devCount').textContent = `${n} / ${PHOTOS} developed`;
  }

  // camera: walk forward with scroll, look around with drag
  let cz = 0, tz = 0, yaw = 0, tyaw = 0, pitch = 0, tpitch = 0, px = 0, tpx = 0;
  const MAXZ = (LINES - 1) * GAP + 420;
  addEventListener('wheel', (e) => { if (box.classList.contains('open')) return; tz = Math.max(-200, Math.min(MAXZ, tz + e.deltaY * .9)); }, { passive: true });
  let dragging = false, lx = 0, ly = 0, moved = false, dx0 = 0;
  addEventListener('pointerdown', (e) => { if (box.classList.contains('open')) return; dragging = true; moved = false; lx = dx0 = e.clientX; ly = e.clientY; });
  addEventListener('pointermove', (e) => {
    // idle parallax toward the pointer
    tpitch = (e.clientY / innerHeight - .5) * -6;
    if (!dragging) return;
    if (Math.abs(e.clientX - dx0) > 4) moved = true;
    tyaw = Math.max(-28, Math.min(28, tyaw + (e.clientX - lx) * .08));
    tpx = Math.max(-700, Math.min(700, tpx + (e.clientX - lx) * 1.2));
    lx = e.clientX; ly = e.clientY;
  });
  addEventListener('pointerup', () => { dragging = false; });

  function frame() {
    cz += (tz - cz) * .07; yaw += (tyaw - yaw) * .08; pitch += (tpitch - pitch) * .05; px += (tpx - px) * .08;
    world.style.transform = `rotateX(${pitch}deg) rotateY(${yaw}deg) translate3d(${px}px, 0, ${cz}px)`;
    for (const pr of prints) {
      const d = 900 - (pr.z + cz);     // distance from the eye, which sits 900px in front of the screen
      let o = 1;
      if (d < 420) o = Math.max(0, (d - 180) / 240);
      if (d > 2300) o = Math.max(0, 1 - (d - 2300) / 900);
      pr.el.style.opacity = o.toFixed(3);
      pr.el.style.visibility = o < .02 ? 'hidden' : 'visible';
      // the nearest line develops on its own after a moment
      if (d > 520 && d < 1150) { pr.near = (pr.near || 0) + 1; if (pr.near > 90) develop(prints.indexOf(pr)); } else pr.near = 0;
    }
    requestAnimationFrame(frame);
  }
  frame();

  const t0 = Date.now();
  setInterval(() => { const s = Math.floor((Date.now() - t0) / 1000); document.getElementById('clock').textContent = `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; }, 250);

  // lightbox
  const box = document.getElementById('box');
  let openIdx = 0;
  function open(i) {
    openIdx = i; develop(i);
    document.getElementById('boxImg').src = `/files/p${i + 1}.jpg`;
    document.getElementById('capL').textContent = `print no. ${String(i + 1).padStart(2, '0')} — line ${Math.floor(i / 4) + 1}`;
    document.getElementById('capR').textContent = `♥ ${(i * 37) % 90 + 4} · ${(i * 13) % 9} comments · ← →`;
    box.classList.add('open');
  }
  document.getElementById('close').onclick = () => box.classList.remove('open');
  box.addEventListener('click', (e) => { if (e.target === box) box.classList.remove('open'); });
  addEventListener('keydown', (e) => {
    if (!box.classList.contains('open')) return;
    if (e.key === 'Escape') box.classList.remove('open');
    if (e.key === 'ArrowRight') open(Math.min(PHOTOS - 1, openIdx + 1));
    if (e.key === 'ArrowLeft') open(Math.max(0, openIdx - 1));
  });
</script>
</body>
</html>
