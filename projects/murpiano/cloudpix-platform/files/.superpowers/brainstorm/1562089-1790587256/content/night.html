<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>CloudPix — B · Night Flight</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Fraunces:ital,opsz,wght@1,9..144,300;1,9..144,500&display=swap" rel="stylesheet" />
<style>
  :root { --sky: #04060d; --lamp: #ffc86b; --text: #e8ecf6; --muted: #7f89a3; --line: rgba(255, 200, 107, .6); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
  body { background: var(--sky); color: var(--text); font-family: 'Space Grotesk'; font-size: 14px; user-select: none; -webkit-user-select: none; touch-action: none; }
  canvas { position: fixed; inset: 0; display: block; }
  #globe { cursor: grab; }
  #globe.drag { cursor: grabbing; }

  .top { position: fixed; left: 0; right: 0; top: 0; z-index: 5; padding: max(18px, env(safe-area-inset-top)) 22px 0; display: flex; justify-content: space-between; pointer-events: none; }
  .brand { font-weight: 700; font-size: 20px; letter-spacing: -.01em; }
  .brand small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); margin-top: 4px; }
  .totals { text-align: right; font-size: 12px; color: var(--muted); line-height: 1.6; }
  .totals b { color: var(--text); font-weight: 500; }

  /* the flight caption, like a boarding pass line */
  .caption { position: fixed; left: 22px; top: 50%; transform: translateY(-50%); z-index: 5; max-width: min(460px, 70vw); pointer-events: none; }
  .caption .when { font-size: 12px; letter-spacing: .24em; text-transform: uppercase; color: var(--lamp); }
  .caption h2 { font-family: 'Fraunces'; font-style: italic; font-weight: 300; font-size: clamp(40px, 6.5vw, 92px); line-height: .95; letter-spacing: -.02em; margin-top: 10px; }
  .caption .route { margin-top: 14px; font-size: 13px; color: var(--muted); display: flex; gap: 10px; align-items: center; }
  .caption .route b { color: var(--text); font-weight: 500; }
  .caption .route i { flex: 0 0 60px; height: 1px; background: repeating-linear-gradient(90deg, var(--muted) 0 4px, transparent 4px 8px); }
  .caption .open { pointer-events: auto; margin-top: 18px; display: inline-flex; gap: 10px; align-items: center; border: 1px solid rgba(255,200,107,.5); background: rgba(255,200,107,.08); color: var(--lamp); border-radius: 99px; padding: 10px 18px; font: inherit; font-weight: 500; cursor: pointer; }
  .caption .open:hover { background: rgba(255,200,107,.18); }
  .fade { transition: opacity .5s, transform .5s; }
  .fade.out { opacity: 0; transform: translateY(calc(-50% + 12px)); }

  /* timeline */
  .timeline { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; padding: 0 22px max(18px, env(safe-area-inset-bottom)); }
  .tl-row { display: flex; align-items: center; gap: 14px; }
  .play { flex: none; width: 46px; height: 46px; border-radius: 50%; border: 1px solid rgba(255,200,107,.5); background: rgba(255,200,107,.1); color: var(--lamp); font-size: 16px; cursor: pointer; }
  .track { position: relative; flex: 1; height: 58px; cursor: pointer; touch-action: none; }
  .track .base { position: absolute; left: 0; right: 0; top: 29px; height: 1px; background: rgba(127,137,163,.4); }
  .track .done { position: absolute; left: 0; top: 29px; height: 1px; background: var(--lamp); }
  .track .trip { position: absolute; top: 24px; width: 11px; height: 11px; margin-left: -5.5px; border-radius: 50%; background: var(--sky); border: 1px solid var(--muted); }
  .track .trip.past { background: var(--lamp); border-color: var(--lamp); box-shadow: 0 0 10px var(--lamp); }
  .track .year { position: absolute; top: 42px; transform: translateX(-50%); font-size: 11px; color: var(--muted); }
  .track .knob { position: absolute; top: 14px; width: 2px; height: 30px; margin-left: -1px; background: var(--text); }
  .track .knob::after { content: '✈'; position: absolute; top: -18px; left: -6px; font-size: 14px; color: var(--text); transform: rotate(90deg); }

  /* the porthole */
  .cabin { position: fixed; inset: 0; z-index: 20; background: radial-gradient(ellipse at 50% 50%, #cfd4dc, #9aa1ad 60%, #6f7683); display: grid; place-items: center; opacity: 0; pointer-events: none; transition: opacity .6s; }
  .cabin.on { opacity: 1; pointer-events: auto; }
  .cabin::before { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 2px, transparent 2px 7px); pointer-events: none; }
  .window { position: relative; width: min(64vw, 380px); aspect-ratio: 5 / 7.4; border-radius: 46% / 32%; padding: 22px; background: linear-gradient(145deg, #eef0f3, #b7bdc7); box-shadow: 0 30px 60px rgba(0,0,0,.35), inset 0 2px 6px rgba(255,255,255,.8), inset 0 -8px 20px rgba(0,0,0,.18); transform: scale(.9); transition: transform .7s cubic-bezier(.2,.8,.2,1); }
  .cabin.on .window { transform: none; }
  .glass { position: relative; width: 100%; height: 100%; border-radius: 46% / 32%; overflow: hidden; background: #8fb4d9; box-shadow: inset 0 0 0 6px #d9dde3, inset 0 0 40px rgba(0,0,0,.45); }
  .glass img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 1.2s; }
  .glass img.on { opacity: 1; animation: drift 9s linear forwards; }
  @keyframes drift { from { transform: scale(1.12) translateX(3%); } to { transform: scale(1.22) translateX(-3%); } }
  .cloud { position: absolute; left: -60%; width: 220%; height: 60%; background: radial-gradient(ellipse at 30% 50%, rgba(255,255,255,.95), rgba(255,255,255,0) 60%), radial-gradient(ellipse at 70% 55%, rgba(255,255,255,.9), rgba(255,255,255,0) 55%); filter: blur(6px); opacity: 0; pointer-events: none; }
  .cloud.go { animation: pass 1.6s ease-in-out; }
  @keyframes pass { 0% { transform: translateX(60%); opacity: 0; } 35%, 65% { opacity: 1; } 100% { transform: translateX(-60%); opacity: 0; } }
  .shade { position: absolute; left: 22px; right: 22px; top: 22px; height: 22%; border-radius: 46% 46% 6px 6px / 70% 70% 6px 6px; background: linear-gradient(#f4f5f7, #d6dae0); box-shadow: 0 6px 12px rgba(0,0,0,.2); transition: height .8s cubic-bezier(.3,.7,.2,1); }
  .shade::after { content: ''; position: absolute; left: 42%; right: 42%; bottom: 8px; height: 6px; border-radius: 3px; background: #aeb4bd; }
  .cabin.closing .shade { height: calc(100% - 44px); }
  .seat { position: absolute; left: 50%; transform: translateX(-50%); bottom: max(22px, env(safe-area-inset-bottom)); text-align: center; color: #2c313a; width: min(92vw, 520px); }
  .seat h3 { font-family: 'Fraunces'; font-style: italic; font-weight: 500; font-size: 26px; }
  .seat p { font-size: 12px; color: #4e5563; margin-top: 4px; }
  .thumbs { display: flex; gap: 8px; justify-content: center; margin-top: 12px; }
  .thumbs button { width: 44px; height: 44px; border-radius: 10px; border: 2px solid transparent; padding: 0; overflow: hidden; cursor: pointer; background: #fff; }
  .thumbs button.on { border-color: #2c313a; }
  .thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cabin .x { position: absolute; right: 18px; top: max(18px, env(safe-area-inset-top)); width: 44px; height: 44px; border-radius: 50%; border: 0; background: #2c313a; color: #fff; font-size: 16px; cursor: pointer; }
  .cabin .flight { position: absolute; left: 22px; top: max(22px, env(safe-area-inset-top)); color: #2c313a; font-size: 12px; letter-spacing: .2em; text-transform: uppercase; }

  @media (max-width: 640px) {
    .caption { top: auto; bottom: 120px; transform: none; max-width: calc(100vw - 44px); }
    .fade.out { transform: translateY(12px); }
    .caption h2 { font-size: 44px; }
    .totals { display: none; }
    .window { width: min(72vw, 330px); }
  }
</style>
</head>
<body>
  <canvas id="stars"></canvas>
  <canvas id="globe"></canvas>

  <header class="top">
    <div class="brand">cloudpix<small>every trip I have taken, by night</small></div>
    <div class="totals" id="totals"></div>
  </header>

  <div class="caption fade" id="caption">
    <div class="when" id="when"></div>
    <h2 id="place"></h2>
    <div class="route" id="route"></div>
    <button class="open" id="open">Look out of the window →</button>
  </div>

  <div class="timeline">
    <div class="tl-row"><button class="play" id="play" aria-label="Play">▶</button><div class="track" id="track"><div class="base"></div><div class="done" id="done"></div><div class="knob" id="knob"></div></div></div>
  </div>

  <div class="cabin" id="cabin">
    <div class="flight" id="flightNo"></div>
    <button class="x" id="closeCabin" aria-label="Close">✕</button>
    <div class="window"><div class="glass" id="glass"><div class="cloud" id="cloud" style="top:20%"></div></div><div class="shade"></div></div>
    <div class="seat"><h3 id="seatTitle"></h3><p id="seatSub"></p><div class="thumbs" id="thumbs"></div></div>
  </div>

<script src="/files/d3.min.js"></script>
<script src="/files/topojson.min.js"></script>
<script src="/files/atlas-data.js"></script>
<script>
const A = window.ATLAS;
const globe = document.getElementById('globe'), stars = document.getElementById('stars');
const g = globe.getContext('2d'), s = stars.getContext('2d');
let svgPath, W, H, dpr, projection, path, land, borders, lights = [];
const trips = A.trips();
let idx = 0, rot = [0, -20], targetRot = null, arcT = 1, arcFrom = null, arcTo = null, playing = false;

function size() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  for (const c of [globe, stars]) { c.width = W * dpr; c.height = H * dpr; c.style.width = W + 'px'; c.style.height = H + 'px'; }
  g.setTransform(dpr, 0, 0, dpr, 0, 0); s.setTransform(dpr, 0, 0, dpr, 0, 0);
  // the planet sits low and large, like the horizon from cruising altitude
  const mobile = W < 640;
  const r = mobile ? W * .95 : Math.max(W, H) * .5;
  projection = d3.geoOrthographic().scale(r).translate([mobile ? W / 2 : W * .62, mobile ? H * .52 : H * .5 + r * .28]).clipAngle(90).precision(2);
  path = d3.geoPath(projection, g);
  svgPath = d3.geoPath(projection).digits(1);
  drawStars();
}
function drawStars() {
  s.fillStyle = '#04060d'; s.fillRect(0, 0, W, H);
  let seed = 3; const r = () => (seed = seed * 16807 % 2147483647) / 2147483647;
  for (let i = 0; i < 420; i++) { s.globalAlpha = .2 + r() * .7; s.fillStyle = '#fff'; s.beginPath(); s.arc(r() * W, r() * H, r() * 1.1, 0, 7); s.fill(); }
  s.globalAlpha = 1;
}

const vec = (lon, lat) => { const l = lon * Math.PI / 180, p = lat * Math.PI / 180; return [Math.cos(p) * Math.cos(l), Math.cos(p) * Math.sin(l), Math.sin(p)]; };
// ambient lights: dim random dots over land, so the planet does not look empty
function buildLights(features) {
  let seed = 11; const r = () => (seed = seed * 16807 % 2147483647) / 2147483647;
  const out = [];
  for (let n = 0; out.length < 1400 && n < 40000; n++) {
    const lon = r() * 360 - 180, lat = Math.asin(r() * 1.7 - .85) * 180 / Math.PI;
    if (d3.geoContains(features, [lon, lat])) out.push({ ll: [lon, lat], v: vec(lon, lat), b: Math.floor(r() * 3) });
  }
  return out;
}

function draw() {
  projection.rotate(rot);
  g.clearRect(0, 0, W, H);
  const [cx, cy] = projection.translate(), R = projection.scale();
  // atmosphere
  const atm = g.createRadialGradient(cx, cy, R * .96, cx, cy, R * 1.12);
  atm.addColorStop(0, 'rgba(90,140,255,.35)'); atm.addColorStop(1, 'rgba(90,140,255,0)');
  g.fillStyle = atm; g.beginPath(); g.arc(cx, cy, R * 1.12, 0, 7); g.fill();
  // ocean
  const oc = g.createRadialGradient(cx - R * .3, cy - R * .4, R * .1, cx, cy, R);
  oc.addColorStop(0, '#0d1a33'); oc.addColorStop(1, '#050913');
  g.fillStyle = oc; g.beginPath(); g.arc(cx, cy, R, 0, 7); g.fill();
  // land and borders
  const landPath = new Path2D(svgPath(land)), borderPath = new Path2D(svgPath(borders));
  g.fillStyle = '#16213b'; g.fill(landPath);
  g.strokeStyle = 'rgba(120,150,210,.16)'; g.lineWidth = .6; g.stroke(borderPath);
  g.strokeStyle = 'rgba(150,185,255,.42)'; g.lineWidth = .9; g.stroke(landPath);
  // lights
  g.globalCompositeOperation = 'lighter';
  const center = projection.invert([cx, cy]);
  const cv = vec(center[0], center[1]);
  // three brightness buckets, one fill each
  for (let b = 0; b < 3; b++) {
    g.beginPath();
    for (const L of lights) {
      if (L.b !== b || L.v[0] * cv[0] + L.v[1] * cv[1] + L.v[2] * cv[2] < .06) continue;
      const p = projection(L.ll); g.rect(p[0], p[1], 1.4, 1.4);
    }
    g.fillStyle = `rgba(255,190,110,${[.2, .35, .55][b]})`; g.fill();
  }
  // my cities: warm glow sized by photos; past trips brighter
  const now = trips[idx];
  for (const city of A.cities()) {
    if (d3.geoDistance([city.lon, city.lat], center) > 1.5) continue;
    const p = projection([city.lon, city.lat]); if (!p) continue;
    const photos = A.sum(city.albums, (a) => a.photos);
    const seen = trips.slice(0, idx + 1).some((t) => t.city === city);
    const rr = (seen ? 10 : 5) + Math.sqrt(photos) * (seen ? 1.4 : .6);
    const gl = g.createRadialGradient(p[0], p[1], 0, p[0], p[1], rr);
    gl.addColorStop(0, seen ? 'rgba(255,220,150,.95)' : 'rgba(255,200,120,.35)');
    gl.addColorStop(.25, seen ? 'rgba(255,170,70,.45)' : 'rgba(255,170,70,.1)');
    gl.addColorStop(1, 'rgba(255,150,50,0)');
    g.fillStyle = gl; g.beginPath(); g.arc(p[0], p[1], rr, 0, 7); g.fill();
    if (now && now.city === city) { g.strokeStyle = 'rgba(255,220,160,.8)'; g.lineWidth = 1; g.beginPath(); g.arc(p[0], p[1], rr * .8 + Math.sin(performance.now() / 300) * 3, 0, 7); g.stroke(); }
  }
  g.globalCompositeOperation = 'source-over';
  // the current leg, drawn as a great circle with the plane at its head
  if (arcFrom && arcTo) {
    const ip = d3.geoInterpolate([arcFrom.lon, arcFrom.lat], [arcTo.lon, arcTo.lat]);
    const pts = d3.range(0, arcT + .001, .01).map(ip);
    g.beginPath(); path({ type: 'LineString', coordinates: pts });
    g.setLineDash([5, 6]); g.strokeStyle = 'rgba(255,210,140,.85)'; g.lineWidth = 1.6; g.stroke(); g.setLineDash([]);
    const head = projection(ip(arcT));
    if (head && d3.geoDistance(ip(arcT), center) < 1.5) { g.fillStyle = '#fff'; g.beginPath(); g.arc(head[0], head[1], 3, 0, 7); g.fill(); }
  }
}

function loop() {
  if (targetRot) {
    rot = [rot[0] + (targetRot[0] - rot[0]) * .06, rot[1] + (targetRot[1] - rot[1]) * .06];
    if (Math.abs(targetRot[0] - rot[0]) < .05 && Math.abs(targetRot[1] - rot[1]) < .05) targetRot = null;
  } else if (!dragging && !playing) rot[0] += .02;
  if (arcT < 1) arcT = Math.min(1, arcT + .012);
  draw();
  requestAnimationFrame(loop);
}

// ---------- trips and timeline ----------
const track = document.getElementById('track');
const t0 = trips[0].year + (trips[0].month - 1) / 12, t1 = trips[trips.length - 1].year + (trips[trips.length - 1].month) / 12;
const pos = (t) => ((t.year + (t.month - 1) / 12) - t0) / (t1 - t0) * 100;
trips.forEach((t, i) => { const d = document.createElement('div'); d.className = 'trip'; d.style.left = pos(t) + '%'; d.title = t.city.name; track.appendChild(d); });
for (let y = trips[0].year; y <= trips[trips.length - 1].year; y++) { const d = document.createElement('div'); d.className = 'year'; d.style.left = ((y - t0) / (t1 - t0) * 100) + '%'; d.textContent = y; if (y >= t0) track.appendChild(d); }

function goTo(i, fly = true) {
  i = Math.max(0, Math.min(trips.length - 1, i));
  const prev = trips[idx], t = trips[i];
  arcFrom = i !== idx ? prev.city : null; arcTo = t.city; arcT = i !== idx ? 0 : 1;
  idx = i;
  // rotate so the destination sits a little above the centre of the visible cap
  const mobile = W < 640;
  targetRot = [-t.city.lon, -t.city.lat + (mobile ? 0 : 18)];
  if (!fly) rot = targetRot.slice();
  const cap = document.getElementById('caption');
  cap.classList.add('out');
  setTimeout(() => {
    document.getElementById('when').textContent = `${A.MONTHS[t.month - 1]} ${t.year} · trip ${i + 1} of ${trips.length}`;
    document.getElementById('place').textContent = t.city.name;
    document.getElementById('route').innerHTML = arcFrom ? `<b>${arcFrom.name}</b><i></i><b>${t.city.name}, ${t.city.country.name}</b>` : `<b>${t.city.country.name}</b> · ${t.title} · ${t.photos} photos`;
    cap.classList.remove('out');
  }, 350);
  const p = pos(t);
  document.getElementById('knob').style.left = p + '%';
  document.getElementById('done').style.width = p + '%';
  [...track.querySelectorAll('.trip')].forEach((el, k) => el.classList.toggle('past', k <= i));
  const tt = A.totals();
  const seen = trips.slice(0, i + 1);
  document.getElementById('totals').innerHTML = `<b>${new Set(seen.map((x) => x.city.country)).size}</b> of ${tt.countries} countries so far<br><b>${A.sum(seen, (x) => x.photos).toLocaleString('en')}</b> photos · <b>${Math.round(A.sum(seen.slice(1).map((x, k) => d3.geoDistance([seen[k].city.lon, seen[k].city.lat], [x.city.lon, x.city.lat]) * 6371), (d) => d)).toLocaleString('en')}</b> km flown`;
}

function scrub(e) {
  const r = track.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width * 100;
  let best = 0, bd = 1e9;
  trips.forEach((t, i) => { const d = Math.abs(pos(t) - x); if (d < bd) { bd = d; best = i; } });
  if (best !== idx) goTo(best);
}
let scrubbing = false;
track.addEventListener('pointerdown', (e) => { scrubbing = true; track.setPointerCapture(e.pointerId); stop(); scrub(e); });
track.addEventListener('pointermove', (e) => { if (scrubbing) scrub(e); });
track.addEventListener('pointerup', () => { scrubbing = false; });

let timer = null;
function stop() { playing = false; clearInterval(timer); document.getElementById('play').textContent = '▶'; }
document.getElementById('play').onclick = () => {
  if (playing) return stop();
  playing = true; document.getElementById('play').textContent = '❚❚';
  if (idx >= trips.length - 1) goTo(0); else goTo(idx + 1);
  timer = setInterval(() => { if (idx >= trips.length - 1) return stop(); goTo(idx + 1); }, 2600);
};
addEventListener('keydown', (e) => {
  if (document.getElementById('cabin').classList.contains('on')) { if (e.key === 'Escape') closeCabin(); if (e.key === 'ArrowRight') showShot(shot + 1); if (e.key === 'ArrowLeft') showShot(shot - 1); return; }
  if (e.key === 'ArrowRight') { stop(); goTo(idx + 1); }
  if (e.key === 'ArrowLeft') { stop(); goTo(idx - 1); }
  if (e.key === 'Enter') openCabin();
});

// ---------- drag the globe, tap a light ----------
let dragging = false, last = null, moved = false;
globe.addEventListener('pointerdown', (e) => { dragging = true; moved = false; last = [e.clientX, e.clientY]; targetRot = null; globe.classList.add('drag'); globe.setPointerCapture(e.pointerId); stop(); });
globe.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  const dx = e.clientX - last[0], dy = e.clientY - last[1];
  if (Math.hypot(dx, dy) > 2) moved = true;
  const k = 70 / projection.scale();
  rot = [rot[0] + dx * k * 1.4, Math.max(-70, Math.min(70, rot[1] - dy * k * 1.4))];
  last = [e.clientX, e.clientY];
});
globe.addEventListener('pointerup', (e) => {
  dragging = false; globe.classList.remove('drag');
  if (moved) return;
  // tap: nearest of my cities within 36px
  let best = null, bd = 36;
  for (const city of A.cities()) { const p = projection([city.lon, city.lat]); if (!p || d3.geoDistance([city.lon, city.lat], projection.invert(projection.translate())) > 1.5) continue; const d = Math.hypot(p[0] - e.clientX, p[1] - e.clientY); if (d < bd) { bd = d; best = city; } }
  if (!best) return;
  const i = trips.findIndex((t) => t.city === best);
  if (i === idx) openCabin(); else goTo(i);
});

// ---------- the window seat ----------
const cabin = document.getElementById('cabin'), glass = document.getElementById('glass');
let shots = [], shot = 0;
document.getElementById('open').onclick = openCabin;
function openCabin() {
  stop();
  const t = trips[idx];
  shots = A.photosOf(t.city);
  document.getElementById('flightNo').textContent = `CPX ${String(100 + idx * 7).padStart(3, '0')} · ${t.city.country.name}`;
  document.getElementById('seatTitle').textContent = t.title;
  document.getElementById('seatSub').textContent = `${t.city.name}, ${t.city.country.name} · ${A.MONTHS[t.month - 1]} ${t.year} · ${t.photos} photos`;
  glass.querySelectorAll('img').forEach((n) => n.remove());
  const thumbs = document.getElementById('thumbs'); thumbs.innerHTML = '';
  shots.forEach((p, k) => {
    const img = document.createElement('img'); img.src = A.src(p); img.alt = ''; glass.insertBefore(img, glass.firstChild);
    const b = document.createElement('button'); b.innerHTML = `<img src="${A.src(p)}" alt="">`; b.onclick = () => showShot(k); thumbs.appendChild(b);
  });
  cabin.classList.remove('closing'); cabin.classList.add('on');
  shot = -1; showShot(0);
}
let swipeX = null;
glass.addEventListener('pointerdown', (e) => { swipeX = e.clientX; });
glass.addEventListener('pointerup', (e) => { if (swipeX === null) return; const d = e.clientX - swipeX; swipeX = null; if (Math.abs(d) > 40) showShot(shot + (d < 0 ? 1 : -1)); else showShot(shot + 1); });

  [...document.getElementById('thumbs').children].forEach((b, i) => b.classList.toggle('on', i === k));
